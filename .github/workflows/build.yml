name: AERO SHARE Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate or generate project
        id: proj
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "parts/part_*.py" > /dev/null; then
            COUNT=$(find parts -maxdepth 1 -name 'part_*.py' | wc -l)
            echo "Found $COUNT part(s)"
            if [ "$COUNT" -ne 8 ]; then
              echo "ERROR: need exactly 8 parts (part_01.py .. part_08.py)"
              exit 1
            fi
            cat parts/part_*.py > make_project.py
            python3 make_project.py
            echo "dir=AERO_SHARE" >> "$GITHUB_OUTPUT"
            echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
          else
            ARCHIVE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
            if [ -z "$ARCHIVE" ]; then
              echo "ERROR: no parts/ and no project ZIP found"
              exit 1
            fi
            echo "Using archive: $ARCHIVE"
            mkdir -p extracted
            unzip -q "$ARCHIVE" -d extracted
            DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
            if [ -z "$DIR" ]; then
              echo "ERROR: Gradle project not found inside archive"
              exit 1
            fi
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin --no-daemon
          fi
          chmod +x gradlew

      - name: Pack project ZIP
        if: steps.proj.outputs.bootstrapped == 'true'
        run: |
          rm -f AERO_SHARE_PROJECT.zip
          zip -qr AERO_SHARE_PROJECT.zip "${{ steps.proj.outputs.dir }}" -x '*/.gradle/*' '*/build/*'
          ls -lh AERO_SHARE_PROJECT.zip

      - name: Validate project
        working-directory: ${{ steps.proj.outputs.dir }}
        run: ./gradlew help --no-daemon

      - name: Run unit tests
        working-directory: ${{ steps.proj.outputs.dir }}
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Commit validated ZIP
        if: >-
          steps.proj.outputs.bootstrapped == 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f AERO_SHARE_PROJECT.zip
          git rm -r -f --ignore-unmatch parts make_project.py aero_patch.py
          git commit -m "CI: pack validated AERO_SHARE_PROJECT.zip [skip ci]" || exit 0
          git push

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AERO-SHARE-APK
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            ${{ steps.proj.outputs.dir }}/**/build/reports/**
            ${{ steps.proj.outputs.dir }}/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
