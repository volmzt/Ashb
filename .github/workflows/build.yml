name: AERO SHARE Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate or generate project
        id: proj
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "parts/part_*.py" > /dev/null; then
            echo "dir=AERO_SHARE" >> "$GITHUB_OUTPUT"
            echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
            COUNT=$(find parts -maxdepth 1 -name 'part_*.py' | wc -l)
            echo "Found $COUNT part(s)"
            if [ "$COUNT" -ne 8 ]; then echo "ERROR: need 8 parts"; exit 1; fi
            for f in parts/part_*.py; do
              python3 -c "import ast,sys; ast.parse(open(sys.argv[1],encoding='utf-8').read())" "$f" || { echo "SYNTAX ERROR IN $f"; exit 1; }
            done
            : > make_project.py
            for f in parts/part_*.py; do
              cat "$f" >> make_project.py
              printf '\n\n' >> make_project.py
            done
            python3 make_project.py
          else
            ARCHIVE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
            if [ -z "$ARCHIVE" ]; then echo "ERROR: no parts and no ZIP"; exit 1; fi
            mkdir -p extracted
            unzip -q "$ARCHIVE" -d extracted
            DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
            if [ -z "$DIR" ]; then echo "ERROR: no Gradle project"; exit 1; fi
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-fix sources
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          python3 - <<'PY'
          import pathlib
          root = pathlib.Path("app/src/main/java/com/aero/share")

          th = root / "ui/AeroTheme.kt"
          s = th.read_text(encoding="utf-8")
          if "onDismiss: () -> Unit)" in s:
              th.write_text(s.replace("onDismiss: () -> Unit)", "onDismiss: () -> Unit = onConfirm)"), encoding="utf-8")
              print("FIXED: AeroDialog default")
          else:
              print("OK: AeroDialog")

          A = [
            "package com.aero.share",
            "",
            "import android.app.Application",
            "import com.aero.share.core.Identity",
            "import com.aero.share.data.*",
            "import com.aero.share.net.DeviceTls",
            "import com.aero.share.net.Discovery",
            "import com.aero.share.net.Target",
            "import com.aero.share.net.TransferEngine",
            "import com.aero.share.service.TransferService",
            "import com.aero.share.storage.OutFile",
            "import com.aero.share.storage.ReceiverStore",
            "import kotlinx.coroutines.*",
            "import kotlinx.coroutines.flow.*",
            "",
            "class AeroApp : Application() {",
            "    val scope = CoroutineScope(SupervisorJob() + Dispatchers.Default)",
            "    lateinit var settings: SettingsStore",
            "    lateinit var identity: Identity",
            "    lateinit var tls: DeviceTls",
            "    lateinit var devices: DeviceRepo",
            "    lateinit var history: HistoryRepo",
            "    lateinit var store: ReceiverStore",
            "    lateinit var engine: TransferEngine",
            "    lateinit var discovery: Discovery",
            "    var settingsNow = AppSettings()",
            "    var pendingFiles: List<OutFile> = emptyList()",
            "    var pendingTotal: Long = 0L",
            "    var pendingTarget: Target? = null",
            "    var scannedQr: String? = null",
            "",
            "    override fun onCreate() {",
            "        super.onCreate()",
            "        settings = SettingsStore(this)",
            "        identity = Identity(this)",
            "        tls = DeviceTls(this)",
            "        val db = AeroDb.build(this)",
            "        devices = DeviceRepo(db.devices())",
            "        history = HistoryRepo(db.history())",
            "        store = ReceiverStore(this)",
            "        engine = TransferEngine(this, tls, identity, store, devices, history, settings, scope)",
            "        discovery = Discovery(this, identity, scope)",
            "        TransferService.createChannels(this)",
            "        runBlocking { runCatching { settingsNow = settings.flow.first() } }",
            "        scope.launch { settings.flow.collect { settingsNow = it } }",
            "        scope.launch(Dispatchers.IO) { runCatching { tls.certificate } }",
            "    }",
            "}",
          ]
          (root / "AeroApp.kt").write_text("\n".join(A) + "\n", encoding="utf-8")
          print("REWROTE: AeroApp.kt")

          te = root / "net/TransferEngine.kt"
          s = te.read_text(encoding="utf-8")
          if "import com.aero.share.core.Identity" not in s:
              s = s.replace("import com.aero.share.core.Hash", "import com.aero.share.core.Hash\nimport com.aero.share.core.Identity", 1)
              print("FIXED: Identity import")
          else:
              print("OK: Identity import")

          L = [
            "            while (true) {",
            "                val m = Proto.read<Msg>(inp)",
            "                when (m.type) {",
            '                    "FILE" -> receiveFile(m.id ?: throw IOException("No file id"))',
            '                    "DONE" -> {',
            '                        Proto.write(out, Msg("DONE_ACK", transferId = tid))',
            "                        setState(TState.Completed)",
            "                        record(_active.value!!)",
            "                        Feedback.success(ctx, cfg)",
            "                        return",
            "                    }",
            '                    "PAUSE" -> {',
            "                        pausedReceives[tid] = done.toList()",
            "                        setState(TState.Paused)",
            "                        return",
            "                    }",
            '                    "CANCEL" -> {',
            "                        setState(TState.Cancelled)",
            "                        record(_active.value!!)",
            "                        return",
            "                    }",
            '                    else -> throw IOException("Bad frame")',
            "                }",
            "            }",
          ]
          i = s.find("            while (true) {")
          j = s.find("        } catch (e: IntegrityException)")
          if i != -1 and j != -1 and j > i:
              s = s[:i] + "\n".join(L) + "\n" + s[j:]
              print("FIXED: dispatch loop")
          else:
              print("OK: dispatch loop")
          te.write_text(s, encoding="utf-8")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin --no-daemon
          fi
          chmod +x gradlew

      - name: Pack project ZIP
        if: steps.proj.outputs.bootstrapped == 'true'
        run: |
          rm -f AERO_SHARE_PROJECT.zip
          zip -qr AERO_SHARE_PROJECT.zip "${{ steps.proj.outputs.dir }}" -x '*/.gradle/*' '*/build/*'
          ls -lh AERO_SHARE_PROJECT.zip

      - name: Run unit tests
        working-directory: ${{ steps.proj.outputs.dir }}
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Commit validated ZIP
        if: >-
          steps.proj.outputs.bootstrapped == 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f AERO_SHARE_PROJECT.zip
          git rm -r -f --ignore-unmatch parts make_project.py
          git commit -m "CI: pack validated AERO_SHARE_PROJECT.zip [skip ci]" || exit 0
          git push

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AERO-SHARE-APK
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure() && steps.proj.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ steps.proj.outputs.dir }}/app/build/reports
          if-no-files-found: ignore
          retention-days: 7
