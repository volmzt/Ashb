- name: Auto-fix sources and dump diagnostics
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          python3 - <<'PY'
          import pathlib
          root = pathlib.Path("app/src/main/java/com/aero/share")

          th = root / "ui/AeroTheme.kt"
          s = th.read_text(encoding="utf-8")
          if "onDismiss: () -> Unit)" in s:
              th.write_text(s.replace("onDismiss: () -> Unit)", "onDismiss: () -> Unit = onConfirm)"), encoding="utf-8")
              print("FIXED: AeroDialog default")
          else:
              print("OK: AeroDialog")

          ap = root / "AeroApp.kt"
          lines = ap.read_text(encoding="utf-8").splitlines()
          out, in_class, dropped = [], False, 0
          for ln in lines:
              if ln.startswith("class AeroApp"):
                  in_class = True
              if in_class and ln.strip().startswith("import "):
                  dropped += 1
                  continue
              out.append(ln)
          ap.write_text("\n".join(out) + "\n", encoding="utf-8")
          print(f"AeroApp: removed {dropped} stray import(s) inside class")

          te = root / "net/TransferEngine.kt"
          s = te.read_text(encoding="utf-8")
          if "import com.aero.share.core.Identity" not in s:
              s = s.replace("import com.aero.share.core.Hash",
                            "import com.aero.share.core.Hash\nimport com.aero.share.core.Identity", 1)
              print("FIXED: Identity import")
          else:
              print("OK: Identity import")

          block = '''            while (true) {
                val m = Proto.read<Msg>(inp)
                when (m.type) {
                    "FILE" -> receiveFile(m.id ?: throw IOException("No file id"))
                    "DONE" -> {
                        Proto.write(out, Msg("DONE_ACK", transferId = tid))
                        setState(TState.Completed)
                        record(_active.value!!)
                        Feedback.success(ctx, cfg)
                        return
                    }
                    "PAUSE" -> {
                        pausedReceives[tid] = done.toList()
                        setState(TState.Paused)
                        return
                    }
                    "CANCEL" -> {
                        setState(TState.Cancelled)
                        record(_active.value!!)
                        return
                    }
                    else -> throw IOException("Bad frame")
                }
            }
          '''
          i = s.find("            while (true) {")
          j = s.find("        } catch (e: IntegrityException)")
          if i != -1 and j != -1 and j > i:
              s = s[:i] + block + s[j:]
              print("FIXED: dispatch loop rewritten")
          else:
              print(f"WARN: dispatch markers not found i={i} j={j}")
          te.write_text(s, encoding="utf-8")
          PY
          echo "===== AeroApp.kt 15-45 ====="
          nl -ba app/src/main/java/com/aero/share/AeroApp.kt | sed -n '15,45p'
          echo "===== TransferEngine.kt 330-375 ====="
          nl -ba app/src/main/java/com/aero/share/net/TransferEngine.kt | sed -n '330,375p'
          echo "===== END ====="
